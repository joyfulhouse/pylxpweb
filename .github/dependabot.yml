version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies (using uv ecosystem)
  # Note: If this fails, we'll fall back to "pip" ecosystem
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor and patch updates
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Ensure compatibility with uv
    reviewers:
      - "bryanli"
    # uv_build is a hermetic release pin: it must match the uv bundled in the
    # release workflow's digest-pinned BUILD_IMAGE (offline build). Bumping it
    # alone breaks the release build (see #307/#308 regression).
    ignore:
      - dependency-name: "uv_build"
