name: CI

# This workflow runs on PRs only (not on pushes to main).
# Branch protection requires "CI Success" to pass before merging.
# This prevents redundant CI runs - tests run once on PR, not again on merge.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: "Run tests against live hardware (may change device and plant settings)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy --strict src/pylxpweb/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=pylxpweb --cov-report=term-missing --cov-report=xml --cov-report=html -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      - name: Upload pytest results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 30

  test-ha-pymodbus:
    name: Modbus transports on Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.8.0", "2026.9.0", "2026.9.4", "2026.10.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python supported by Home Assistant
        run: uv python install 3.14
      - name: Read release constraints and integration manifests
        env:
          GH_TOKEN: ${{ github.token }}
          HA_TAG: ${{ matrix.ha }}
        run: python3 scripts/ha_modbus_requirements.py "$HA_TAG" "$RUNNER_TEMP/ha"
      - name: Verify TCP and serial installs exclude ESPHome dependencies
        run: |
          uv pip compile pyproject.toml --extra modbus-connection --python-version 3.14 \
            --constraint "$RUNNER_TEMP/ha/constraints.txt" --output-file "$RUNNER_TEMP/plain.txt"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          requirements = Path(os.environ["RUNNER_TEMP"], "plain.txt").read_text()
          assert "aioesphomeapi==" not in requirements
          PYCODE
      - name: Co-install Home Assistant and both optional extras
        env:
          HA_TAG: ${{ matrix.ha }}
        run: |
          uv venv --python 3.14 .venv
          uv pip install --constraint "$RUNNER_TEMP/ha/constraints.txt" \
            --requirement "$RUNNER_TEMP/ha/requirements.txt" \
            "homeassistant==$HA_TAG" -e '.[esphome]' \
            pytest pytest-asyncio pytest-timeout aioresponses python-dotenv
          uv pip check
      - name: Run transport and installed Home Assistant wiring tests
        run: uv run --no-sync pytest tests/unit/transports/ -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Live tests include hardware/plant writes and require explicit manual opt-in.
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_tests == true
    timeout-minutes: 30
    environment: integration-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          LUXPOWER_USERNAME: ${{ secrets.LUXPOWER_USERNAME }}
          LUXPOWER_PASSWORD: ${{ secrets.LUXPOWER_PASSWORD }}
          LUXPOWER_BASE_URL: ${{ secrets.LUXPOWER_BASE_URL }}
        run: |
          uv run pytest tests/integration/ \
            -v \
            -m "integration and not control" \
            --reruns 4 \
            --reruns-delay 60 \
            --only-rerun "LuxpowerDeviceOfflineError" \
            --only-rerun "LuxpowerConnectionError" \
            --only-rerun "LuxpowerAPIError" \
            --only-rerun "LuxpowerAuthError" \
            --only-rerun "ContentTypeError" \
            --only-rerun "TimeoutError" \
            --only-rerun "timeout" \
            --only-rerun "DATAFRAME_TIMEOUT" \
            --only-rerun "apiBlocked" \
            --only-rerun "AssertionError" \
            --only-rerun "assert False" \
            --only-rerun "has_data" \
            --tb=short

      - name: Upload integration test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: integration-test-results
          path: |
            .pytest_cache/
            test-results/
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, test-ha-pymodbus, integration]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.test-ha-pymodbus.result }}" != "success" ]]; then
            echo "Home Assistant pymodbus pin job failed"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" != "success" ]] && [[ "${{ needs.integration.result }}" != "skipped" ]]; then
            echo "Integration job failed"
            exit 1
          fi
          echo "All CI checks passed!"
