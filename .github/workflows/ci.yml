name: CI

# This workflow runs on PRs only (not on pushes to main).
# Branch protection requires "CI Success" to pass before merging.
# This prevents redundant CI runs - tests run once on PR, not again on merge.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        run: uv run mypy --strict src/pylxpweb/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=pylxpweb --cov-report=term-missing --cov-report=xml --cov-report=html -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      - name: Upload pytest results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 30

  test-ha-pymodbus:
    # Home Assistant core pins pymodbus (homeassistant/package_constraints.txt)
    # below what uv.lock resolves, and that pin is what the eg4_web_monitor
    # integration's users actually run. Exercise the Modbus transports on it.
    name: Modbus transports on Home Assistant's pymodbus pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HA_PYMODBUS_VERSION: "3.13.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pin pymodbus to Home Assistant's version
        # ``uv run`` re-syncs to the lock by default; ``--no-sync`` below keeps
        # the pin in place for the test run.
        run: |
          uv pip install "pymodbus==${HA_PYMODBUS_VERSION}"
          uv run --no-sync python -c "import pymodbus, sys; print('pymodbus', pymodbus.__version__); sys.exit(pymodbus.__version__ != '${HA_PYMODBUS_VERSION}')"

      - name: Run transport tests
        run: uv run --no-sync pytest tests/unit/transports/ -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Skip entirely for Dependabot PRs (no secret access, tests run after merge)
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 30
    environment: integration-tests
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        env:
          LUXPOWER_USERNAME: ${{ secrets.LUXPOWER_USERNAME }}
          LUXPOWER_PASSWORD: ${{ secrets.LUXPOWER_PASSWORD }}
          LUXPOWER_BASE_URL: ${{ secrets.LUXPOWER_BASE_URL }}
        run: |
          uv run pytest tests/integration/ \
            -v \
            -m integration \
            --reruns 4 \
            --reruns-delay 60 \
            --only-rerun "LuxpowerDeviceOfflineError" \
            --only-rerun "LuxpowerConnectionError" \
            --only-rerun "LuxpowerAPIError" \
            --only-rerun "LuxpowerAuthError" \
            --only-rerun "ContentTypeError" \
            --only-rerun "TimeoutError" \
            --only-rerun "timeout" \
            --only-rerun "DATAFRAME_TIMEOUT" \
            --only-rerun "apiBlocked" \
            --only-rerun "AssertionError" \
            --only-rerun "assert False" \
            --only-rerun "has_data" \
            --tb=short

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-results
          path: |
            .pytest_cache/
            test-results/
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, test-ha-pymodbus, integration]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.test-ha-pymodbus.result }}" != "success" ]]; then
            echo "Home Assistant pymodbus pin job failed"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" != "success" ]] && [[ "${{ needs.integration.result }}" != "skipped" ]]; then
            echo "Integration job failed"
            exit 1
          fi
          echo "All CI checks passed!"
